[build]
command = "npm run build"
publish = "dist"
[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-store"
Service-Worker-Allowed = "/"
[[headers]]
for = "/"
[headers.values]
Cache-Control = "no-cache"
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
